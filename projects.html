            const list = cat === 'all' ? projects : projects.filter(p => p.cat === cat);
            grid.innerHTML = list.map(p => `
                <div class="project-card bg-white rounded-xl shadow-md overflow-hidden" data-id="${p.id}">
                    <div class="h-44 overflow-hidden bg-gray-100">
                        <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover" loading="lazy"

                    </div>
                    <div class="p-5">
                        <div class="flex items-center gap-2 mb-2">

                            <span class="text-yellow-500 text-xs">${p.diff}</span>
                        </div>
                        <h3 class="text-lg font-bold mb-2">${p.name}</h3>
                        <p class="text-gray-600 text-sm mb-3">${p.desc}</p>

                btn.classList.add('bg-blue-600', 'text-white');
                renderProjects(btn.dataset.cat);
            });
        });
