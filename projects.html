<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部项目 - 毕设源码合集</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
</head>
<body class="bg-gray-50">
  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="text-xl font-bold text-indigo-600">毕设源码合集</a>
      <div class="flex gap-6 text-sm">
        <a href="index.html" class="text-gray-600 hover:text-indigo-600">首页</a>
        <a href="projects.html" class="text-indigo-600 font-medium">全部项目</a>
        <a href="topics.html" class="text-gray-600 hover:text-indigo-600">选题大全</a>
        <a href="templates.html" class="text-gray-600 hover:text-indigo-600">论文模板</a>
        <a href="about.html" class="text-gray-600 hover:text-indigo-600">关于我</a>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-2">全部项目</h1>
    <p class="text-gray-500 mb-6">共 <span id="total-count">30</span> 套 Vue3 + SpringBoot 实战项目</p>

    <!-- 分类筛选 -->
    <div class="flex flex-wrap gap-2 mb-8" id="filter-buttons">
    </div>

    <!-- 项目卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="project-grid">
    </div>
  </div>

  <footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm mt-12">
    <p>© 2026 毕设源码合集 · 微信号：hmma2026</p>
  </footer>

  <script src="assets/js/projects.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let currentCat = params.get("cat") || "全部";

    const catIcons = { "电商交易": "🛒", "教育学习": "📚", "医疗健康": "🏥", "社区生活": "🏘️", "出行停车": "🚗", "企业管理": "💼" };

    // 渲染筛选按钮
    document.getElementById("filter-buttons").innerHTML = CATEGORIES.map(cat => `
      <button onclick="filterCat('${cat}')" class="px-4 py-2 rounded-full text-sm font-medium transition ${cat === currentCat ? "bg-indigo-600 text-white" : "bg-white text-gray-600 hover:bg-indigo-50"}">
        ${cat === "全部" ? "全部" : catIcons[cat] + " " + cat}
      </button>
    `).join("");

    function filterCat(cat) {
      currentCat = cat;
      history.replaceState(null, "", cat === "全部" ? "projects.html" : `projects.html?cat=${encodeURIComponent(cat)}`);
      document.querySelectorAll("#filter-buttons button").forEach((btn, i) => {
        btn.className = `px-4 py-2 rounded-full text-sm font-medium transition ${CATEGORIES[i] === currentCat ? "bg-indigo-600 text-white" : "bg-white text-gray-600 hover:bg-indigo-50"}`;
      });
      renderProjects();
    }

    function renderProjects() {
      const list = currentCat === "全部" ? PROJECTS : PROJECTS.filter(p => p.category === currentCat);
      document.getElementById("total-count").textContent = list.length;
      document.getElementById("project-grid").innerHTML = list.map(p => `
        <a href="project-detail.html?id=${p.id}" class="bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-md transition">
          <div class="h-44 bg-gray-100 overflow-hidden">
            <img src="assets/screenshots/${p.cover}" alt="${p.name}" class="w-full h-full object-cover" loading="lazy">
          </div>
          <div class="p-4">
            <div class="flex items-center justify-between mb-2">
              <h3 class="font-bold text-gray-800">${String(p.id).padStart(2, "0")} · ${p.name}</h3>
            </div>
            <p class="text-sm text-gray-500 line-clamp-2 mb-3">${p.desc}</p>
            <div class="flex items-center justify-between text-xs text-gray-400">
              <span>难度 ${getDifficultyStars(p.difficulty)}</span>
              <span>${p.screenshots} 张截图</span>
            </div>
          </div>
        </a>
      `).join("");
    }

    renderProjects();
  </script>
</body>
</html>
