      <div class="flex justify-center gap-8 mb-8">
        <div>
          <div class="text-3xl font-bold">30+</div>
          <div class="text-sm opacity-80">实战项目</div>
        </div>
        <div>
          <div class="text-3xl font-bold">334</div>
          <div class="text-sm opacity-80">真实截图</div>
        </div>
        <div>
          <div class="text-3xl font-bold">6</div>

        <div>

  </footer>

  <script src="assets/js/projects.js"></script>
  <script>
    // 渲染分类入口
    const categories = [
      { name: "电商交易", icon: "🛒", count: PROJECTS.filter(p => p.category === "电商交易").length },
      { name: "教育学习", icon: "📚", count: PROJECTS.filter(p => p.category === "教育学习").length },
      { name: "医疗健康", icon: "🏥", count: PROJECTS.filter(p => p.category === "医疗健康").length },
      { name: "社区生活", icon: "🏘️", count: PROJECTS.filter(p => p.category === "社区生活").length },
      { name: "出行停车", icon: "🚗", count: PROJECTS.filter(p => p.category === "出行停车").length },
      { name: "企业管理", icon: "💼", count: PROJECTS.filter(p => p.category === "企业管理").length }
    ];
    document.getElementById("category-grid").innerHTML = categories.map(c => `
      <a href="projects.html?cat=${encodeURIComponent(c.name)}" class="bg-white rounded-lg shadow-sm p-4 text-center hover:shadow-md transition">
        <div class="text-3xl mb-2">${c.icon}</div>
        <div class="font-medium text-gray-800">${c.name}</div>
        <div class="text-sm text-gray-500">${c.count} 套</div>
      </a>
    `).join("");

    // 渲染热门项目（取难度4-5星的6个）
    const hot = PROJECTS.filter(p => p.difficulty >= 4).slice(0, 6);
    document.getElementById("hot-projects").innerHTML = hot.map(p => `
      <a href="project-detail.html?id=${p.id}" class="bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-md transition">
        <div class="h-40 bg-gray-100 overflow-hidden">
          <img src="assets/screenshots/${p.cover}" alt="${p.name}" class="w-full h-full object-cover" loading="lazy">
        </div>
        <div class="p-4">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-bold text-gray-800">${p.name}</h3>
            <span class="text-xs bg-indigo-100 text-indigo-600 px-2 py-1 rounded">${p.category}</span>
          </div>
          <p class="text-sm text-gray-500 line-clamp-2 mb-3">${p.desc}</p>
          <div class="flex items-center justify-between text-xs text-gray-400">
            <span>难度 ${getDifficultyStars(p.difficulty)}</span>
            <span>${p.screenshots} 张截图</span>
          </div>
        </div>
      </a>
    `).join("");

    function getCategoryIcon(cat) {
      const map = { "电商交易": "🛒", "教育学习": "📚", "医疗健康": "🏥", "社区生活": "🏘️", "出行停车": "🚗", "企业管理": "💼" };
      return map[cat] || "📦";
    }
  </script>
</body>
